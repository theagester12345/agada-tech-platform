# Throwaway caller for next-cloudflare. deploy stays false so this repo
# never talks to Cloudflare.
name: Test next-cloudflare

on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/next-cloudflare.yml"
      - ".github/workflows/test-next-cloudflare.yml"
      - "infra/fixtures/next-cloudflare/**"
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/next-cloudflare.yml"
      - ".github/workflows/test-next-cloudflare.yml"
      - "infra/fixtures/next-cloudflare/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/next-cloudflare.yml
    with:
      working_directory: infra/fixtures/next-cloudflare
      node_version: "24"
      apps: '["client"]'
      workspace_scope: "@agada-fixture"
      deploy: false
