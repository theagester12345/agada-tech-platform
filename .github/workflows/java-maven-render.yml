# Caller: Spring Boot / Maven → GHCR → one Render service.
# Extracted from VovoSpaces .github/workflows/ci.yml (backend, backend-image,
# backend-deploy). Inputs replace what that file hard-coded. No promotion
# input: a second environment is a later caller card, not this recipe.
name: java-maven-render

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory that holds pom.xml and the Dockerfile
        type: string
        default: backend
      java_version:
        description: Temurin major version; must match the pom's java.version
        type: string
        default: "21"
      image_name:
        description: GHCR image without a tag (ghcr.io/<owner>/<name>)
        type: string
        required: true
      deploy:
        description: When true, deploy the new digest to Render. Missing/false is off. The image still builds on a push to main.
        type: boolean
        default: false
    secrets:
      RENDER_API_KEY:
        description: Render API token. Required only when deploy is true.
        required: false
    outputs:
      image:
        description: Image pinned by digest (empty when the image job did not run)
        value: ${{ jobs.backend-image.outputs.image }}

# Least privilege at the workflow. The image job widens this for itself only,
# so a leaked GITHUB_TOKEN from a test-job dependency cannot push or deploy.
permissions:
  contents: read

# One run per caller ref. Off main, a new push cancels the superseded run so
# we don't burn minutes on a build nobody is waiting on. On main a running
# deploy is never cancelled: stopping one half way is worse than a wasted run.
# GitHub still keeps only one waiting run per group, so after several quick
# merges the in-between runs are dropped and the newest waits. That is safe,
# because the newest commit contains the dropped ones and is what ships.
concurrency:
  group: java-maven-render-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runner is pinned, not ubuntu-latest: a caller's build machine should change
# only when this platform ships a release, never under a moving GitHub label.
jobs:
  backend:
    name: Backend — mvn verify (Java ${{ inputs.java_version }})
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v5

      # cache: maven keys ~/.m2 on the pom checksum. The path is required
      # once working_directory is not the repo root.
      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven
          cache-dependency-path: ${{ inputs.working_directory }}/pom.xml

      # `verify` runs unit tests (surefire) AND failsafe *IT suites.
      # The hosted Ubuntu runner ships a running Docker daemon, which Testcontainers needs.
      - name: Build and test
        run: mvn -B -ntp verify

  # Image on every push to main, whatever the deploy switch says. Deploy is a
  # later job so a caller can merge before Render secrets exist without
  # turning main red.
  backend-image:
    name: Backend — build and push image
    needs: [backend]
    # success() is required: a custom if replaces the default "needs succeeded"
    # check, so without it a red test job would still push an image.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ inputs.image_name }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 matches Render's host. The source label links the package
      # to the caller repo, which is what lets GITHUB_TOKEN keep pushing to it.
      # `main` moves with every merge and is only what Terraform points at when
      # it first switches the service to this image; deploys use the digest.
      # Visibility follows the caller repo (a private caller keeps the package
      # private). Do not default a public image of a compiled backend.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.working_directory }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.image_name }}:sha-${{ github.sha }}
            ${{ inputs.image_name }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Without this the digest names an index holding the image plus an
          # attestation, not the image itself. Render pulls by that digest, so
          # keep it a plain image manifest.
          provenance: false

  backend-deploy:
    name: Backend — deploy to Render
    needs: backend-image
    # workflow_call booleans are real booleans. == 'true' is always false.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy &&
      needs.backend-image.result == 'success'
    runs-on: ubuntu-26.04
    steps:
      # github.repository / github.workflow_ref are the caller. The script
      # lives next to this recipe, so check out the called workflow's repo.
      - name: Checkout platform deploy script
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _agada-platform

      - name: Deploy image by digest
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          IMAGE: ${{ needs.backend-image.outputs.image }}
        run: _agada-platform/infra/scripts/render-deploy.sh "$IMAGE"
